[project]
name = "sokhanvar"
version = "0.1.0"
description = "Persian speech synthesis library with YAML configuration and an optional playground"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pocket = [
    "torch>=2.5",
    "pocket-tts @ git+https://github.com/mallahyari/pocket-tts@3807c204babb5fe54be8fe18a362a58315e870d6",
    "transformers>=5.15,<6",
    "sentencepiece>=0.2",
    "scipy>=1.14",
    "typer>=0.15",
]
playground = ["gradio>=6.0,<7"]

[project.urls]
Repository = "https://github.com/tavallaie/sokhanvar"

[project.scripts]
sokhanvar = "sokhanvar.cli:main"
sokhanvar-playground = "sokhanvar.app:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
